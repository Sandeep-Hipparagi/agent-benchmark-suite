name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy strict)
        run: mypy --strict src tests

      - name: Tests (pytest)
        run: pytest

      - name: Leaderboard drift verification
        run: |
          agent-bench verify-leaderboard benchmarks/leaderboards/compress.json --runs 2 --warmup 1
          agent-bench verify-leaderboard benchmarks/leaderboards/provenance.json --runs 2 --warmup 1
          agent-bench verify-leaderboard benchmarks/leaderboards/route.json --runs 2 --warmup 1
          agent-bench verify-leaderboard benchmarks/leaderboards/policy.json --runs 2 --warmup 1

      - name: Leaderboard regeneration is byte-stable
        run: |
          agent-bench run --suite all --runs 2 --warmup 1 --output-dir /tmp/leaderboards
          for s in compress provenance route policy; do
            if ! diff -q "/tmp/leaderboards/$s.json" "benchmarks/leaderboards/$s.json" > /dev/null; then
              echo "::error::Leaderboard $s.json not byte-stable across runs"
              diff "/tmp/leaderboards/$s.json" "benchmarks/leaderboards/$s.json" || true
              exit 1
            fi
          done
          echo "All leaderboards byte-stable."
